<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ipc: https://ipc.localhost; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: https://asset.localhost; media-src 'self' asset: https://asset.localhost" />
  <title>File Arrange for Fish Class</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
  <div class="app-brand">
    <div class="app-brand-icon">
      <img src="icon.png" alt="" width="32" height="32" />
    </div>
    <h1>File Arrange for Fish Class</h1>
  </div>
  <div class="header-folder-path" id="folderPath">폴더를 선택하세요</div>
  <div class="header-stats" id="headerStats"></div>
  <div class="header-actions">
    <a href="#" class="help-link" id="btnHelp" title="사용 도움말">도움말</a>
    <button class="btn-secondary" id="btnReload" disabled>새로고침</button>
    <button type="button" class="btn-primary" id="btnSelectFolder">+ 폴더 선택</button>
  </div>
</header>

<div class="content">
  <div class="card defaults-card">
    <div class="card-title">기본 정보</div>
    <div class="form-row">
      <div class="form-group">
        <label>지역/접두사</label>
        <input type="text" id="inputPointPrefix" list="pointPrefixHistory" placeholder="예: 남애" autocomplete="off" />
        <datalist id="pointPrefixHistory"></datalist>
      </div>
      <div class="form-group">
        <label>포인트이름</label>
        <input type="text" id="inputPointName" list="pointNameHistory" placeholder="예: 밸리" autocomplete="off" />
        <datalist id="pointNameHistory"></datalist>
        <label class="checkbox-label">
          <input type="checkbox" id="chkNight" /> 야간
        </label>
      </div>
      <div class="form-group">
        <label>촬영자이름</label>
        <input type="text" id="inputPhotographer" placeholder="예: 홍길동" />
      </div>
      <div class="form-group">
        <label>촬영일자</label>
        <input type="text" id="inputShootDate" placeholder="예: 20250607" />
        <button type="button" class="btn-secondary btn-small" id="btnToday">오늘 날짜</button>
      </div>
    </div>
  </div>

  <div class="card viewer-card">
    <div class="viewer-main">
      <div class="image-container" id="imageContainer">
        <div class="empty-state" id="emptyState">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <span>폴더를 선택하면 이미지/동영상이 표시됩니다</span>
        </div>
        <img id="imagePreview" class="media-preview hidden" alt="" title="클릭하여 확대" />
        <video id="videoPreview" class="media-preview hidden" controls playsinline muted loop title="클릭하여 확대"></video>
      </div>

      <div class="viewer-controls">
        <div class="fish-name-row">
          <label>물고기 이름</label>
          <input type="text" id="inputFishName" placeholder="예: 황점개볼락" />
          <label class="checkbox-label">
            <input type="checkbox" id="chkJuvenile" /> 유어(J)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkUncertain" /> 이름 불명확/모름
          </label>
        </div>
        <div class="filename-preview filename-preview-muted" id="filenamePreview"></div>
        <div class="nav-buttons">
          <div class="nav-buttons-left">
            <button class="btn-secondary" id="btnPrev" disabled>이전</button>
            <button class="btn-secondary" id="btnNext" disabled>다음</button>
            <span class="viewer-index" id="viewerIndex">0 / 0</span>
          </div>
          <button class="btn-danger" id="btnSkip" disabled>스킵</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span id="statusLeft">준비</span>
  <span id="statusRight"></span>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-zoom-wrap" id="lightboxZoomWrap">
    <img class="lightbox-image" id="lightboxImage" alt="" />
    <video class="lightbox-video hidden" id="lightboxVideo" controls playsinline></video>
  </div>
  <div class="lightbox-zoom-btns">
    <button type="button" class="lightbox-btn" id="lightboxZoomOut" title="축소">−</button>
    <span class="lightbox-zoom-value" id="lightboxZoomValue">100%</span>
    <button type="button" class="lightbox-btn" id="lightboxZoomIn" title="확대">+</button>
  </div>
  <div class="lightbox-hint">더블클릭 확대 · 두손가락 스퀴즈 · ESC 닫기</div>
</div>

<script src="renderer.js"></script>
</body>
</html>
